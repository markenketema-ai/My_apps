<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARK PRO</title><link rel="stylesheet" href="app.css"></head><body>
<div class="layout"><aside id="sidebar"><div class="brand"><span class="mark">M</span><div><b>MARK</b><small>PRO BUSINESS</small></div></div><nav>
<button class="active" data-page="Dashboard">▦ Dashboard</button><button data-page="Sales">↗ Sales</button><button data-page="Purchases">▣ Purchases</button><button data-page="Inventory">◇ Inventory</button><button data-page="Accounts">▤ Accounts</button><button data-page="Reports">▥ Reports</button><button data-page="Settings">⚙ Settings</button></nav><div class="profile">MK &nbsp; <span id="userName">Business Admin</span><button id="logout">Logout</button></div></aside>
<main><header><button id="toggle">☰</button><div><h1 id="heading">Dashboard</h1><small>Business overview · Ethiopian Birr (Br)</small></div><span class="online">● Connected</span></header>

<section id="view" hidden></section></main></div><script src="app.js"></script></body></html>
